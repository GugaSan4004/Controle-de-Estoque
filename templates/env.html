<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambiente</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-900 text-white flex flex-col gap-4 items-center justify-center p-6">

    <div class="w-full max-w-2xl bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-gray-100 border-b border-gray-700 pb-3">⚙️ Variaveis do Ambiente</h1>

        <!-- Form mapping to your backend update route -->
        <form action="/update_env" method="POST" class="space-y-5">
            
            <!-- Loop through the Python OrderedDict -->
            {% for key, value in env.items() %}
            <div class="flex flex-col gap-1.5">
                <label for="{{ key }}" class="text-sm font-semibold text-gray-400 tracking-wide">
                    {{ key }}
                </label>
                <input 
                    type="text" 
                    id="{{ key }}" 
                    name="{{ key }}" 
                    value="{{ value }}" 
                    class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2.5 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
                >
            </div>
            {% endfor %}

            <!-- Action Buttons -->
            <div class="flex justify-end pt-4 gap-4">
                <button type="reset" class="px-5 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 font-medium transition cursor-pointer">
                    Discard Changes
                </button>
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-500 transition shadow-md cursor-pointer">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

    <a href="/" class="text-white/80">Pagina Inicial</a>
</body>
</html>
